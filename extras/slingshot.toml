id = "slingshot"
name = "儿童弹弓"
summary = "先练姿势和瞄准，再用纸靶、罐子和机关搭出自己的靶场。"
card_summary = "从基础瞄准练到百变靶场，每次主要改变一个条件。"
safety = "必须由家长陪同；只用配套的软质弹丸并戴护目镜，只在有挡布的空旷处对靶，绝不朝人或动物发射。"

[[levels]]
short = "基础训练"
name = "基础训练"
goal = "先练站姿和空拉，再从近到远、上下换靶和连续命中。"
steps = [
  "空拉瞄准：不放弹丸，侧身站稳，保持瞄准 3 秒。",
  "近距大靶：从一两步开始，先求方向正确，再慢慢后退。",
  "远近与高低：在约 3 米处练习标准距离，再换成上下两个靶。",
  "连续命中：每次重新检查站姿和安全方向，再平稳松手。",
]
pass_condition = "四组练习各试一轮；命中次数由家长按孩子的年龄和熟练度调整。"
tip = "动作稳定比强行命中重要；孩子没准备好的距离不要急着加。"

[[levels]]
short = "百变靶场"
name = "百变靶场"
goal = "用一根主绳、几根垂绳和夹子换靶，体验翻动、声音、穿透和连锁反馈。"
goal_details = [
  "主绳：5 米以上、约 8 毫米的尼龙编织绳，两端绑在结实支点上拉直，高度高于孩子头顶。",
  "垂绳：用 4～6 毫米细尼龙绳，每隔 25～30 厘米系一根，向下留 30～40 厘米，根部打死结防止滑动。",
  "夹子：垂绳末端绑长尾夹或衣夹；纸靶用夹子，易拉罐和金属件改用绳圈或小挂钩。",
]
steps_title = ""
steps_plain = true
steps = [
  "纸：旧卷子单夹会翻动；两边夹紧绷直，或把纸箱挖个洞，可以做穿透靶。",
  "纸板：顶部用胶带做铰链，打中后会翻面。",
  "易拉罐：用绳圈挂住罐身；后面再挂铁勺或第二个罐，可以连续撞击发声。",
  "泡沫：用较硬的泡沫板或泡沫杯，夹住上端；不要用容易掉碎屑的包装泡沫。",
  "气球：把打结处系在垂绳末端；大球容易打中，小球更难，碎片由家长清理。",
  "毛毡：可选。固定在纸板上，用魔术贴球，打中后直接粘住。",
]
pass_condition = "安全搭好架子，任选几种靶试打，能说出反馈有什么不同。"
tip = "主绳必须固定牢；只在有挡布的空旷靶区使用，易拉罐口要包住。"
