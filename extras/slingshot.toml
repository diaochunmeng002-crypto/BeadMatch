id = "slingshot"
name = "儿童弹弓"
summary = "从空拉瞄准到连续命中，每次只改变一个条件。"
safety = "必须由家长陪同；只用配套的软质弹丸并戴护目镜，只在有挡布的空旷处对靶，绝不朝人或动物发射。"

[[levels]]
short = "空拉瞄准"
name = "空拉瞄准"
goal = "先不放弹丸，练习站稳、握弓和瞄准。"
steps = [
  "侧身站好，前后脚分开，弓口朝向安全靶区。",
  "一手握住弓柄，另一手轻拉皮兜到脸颊外侧。",
  "保持瞄准 3 秒，再慢慢放松皮筋。",
]
pass_condition = "不放弹丸，连续 3 次稳稳保持瞄准 3 秒。"
tip = "身体站稳比用力拉更重要；皮筋不要拉得太满。"

[[levels]]
short = "近距大靶"
name = "近距离大靶"
goal = "从最近距离把软弹打到较大的目标上。"
steps = [
  "站在靶前 1 到 2 步，确认靶后没有人。",
  "装入一颗软质弹丸，按第 1 级的动作瞄准靶心。",
  "平稳松手，观察落点；一共发射 3 次。",
]
pass_condition = "3 发中至少 1 发打到大靶上。"
tip = "先追求方向正确，不要为了命中而加大拉力。"

[[levels]]
short = "标准距离"
name = "标准距离"
goal = "退到稍远处，练习稳定瞄准和松手。"
steps = [
  "站到靶前约 3 米，保持安全射向。",
  "每次装一颗软弹，瞄准同一个靶心再松手。",
  "连续发射 5 次，记住每次偏高还是偏低。",
]
pass_condition = "5 发中至少 2 发打到大靶上。"
tip = "松手时保持原来的站姿，不要整个身体向前冲。"

[[levels]]
short = "高低双靶"
name = "高低双靶"
goal = "在上下两个目标之间调整瞄准。"
steps = [
  "在安全挡布前摆放一高一低两个目标。",
  "站在 3 米处，先打高靶 3 次，再打低靶 3 次。",
  "每次重新站稳，不沿用上一次的偏差。",
]
pass_condition = "6 发中至少各命中高低靶 1 次。"
tip = "换目标时先移动弓口，再微调；不要只抬手或压手。"

[[levels]]
short = "连续命中"
name = "连续命中"
goal = "连续几次维持同一套瞄准动作。"
steps = [
  "站在 3 米处，只保留一个大靶。",
  "每次发射前重新检查站姿和靶后安全。",
  "最多发射 6 次，尽量连续命中。",
]
pass_condition = "最多 6 发中，出现至少连续 3 次命中。"
tip = "打偏后先停一下，重做空拉瞄准，再装下一颗。"
