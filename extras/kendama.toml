id = "kendama"
name = "剑玉"
summary = "五个动作由易到难：先停稳，再练习抛接。每次只练一个。"
safety = "在空旷处练习，先轻抛慢练；不要朝人挥动，也不要让剑尖靠近脸和眼睛。"

[[levels]]
short = "侧皿"
name = "侧皿平衡"
goal = "先把玉稳稳放进剑柄侧面的凹槽，学会让剑保持平衡。"
steps = [
  "一只手握住剑柄，让剑尖朝上。",
  "另一只手把玉轻轻放进侧面的凹槽。",
  "松开扶玉的手，保持 3 秒。",
]
pass_condition = "玉在侧皿里稳住 3 秒。"
tip = "膝盖微弯，眼睛看玉；剑晃时用手腕轻轻修正。"

[[levels]]
short = "底皿"
name = "底皿平衡"
goal = "把玉放进剑柄底部的凹槽，练习另一种平衡位置。"
steps = [
  "把剑倒过来，让底部的凹槽朝上。",
  "把玉轻轻放进底皿，确认落稳。",
  "松开扶玉的手，保持 3 秒。",
]
pass_condition = "玉在底皿里稳住 3 秒。"
tip = "先握住靠近底座的位置，再把剑端平；不要急着追求长时间。"

[[levels]]
short = "剑尖"
name = "剑尖平衡"
goal = "把玉孔对准剑尖，让玉停在剑尖上。"
steps = [
  "找到玉上的小孔和剑柄顶端的剑尖。",
  "一手扶稳剑，另一手让玉孔对准剑尖。",
  "轻轻放下并松手，保持 3 秒。",
]
pass_condition = "剑尖穿进玉孔，玉稳住 3 秒。"
tip = "先对准、后放手；保持剑尖垂直，别用剑去顶玉。"

[[levels]]
short = "抛侧皿"
name = "抛上侧皿"
goal = "把玉轻轻抛起，再用剑柄侧面的凹槽接住。"
steps = [
  "玉放在侧皿里，握住剑柄站好。",
  "微微屈膝，把玉轻轻向上抛起。",
  "盯着玉，用侧皿接住；接住后停 2 秒。",
]
pass_condition = "一次干净的抛接，并在侧皿里停住 2 秒。"
tip = "先低一点、慢一点；宁可接不住，也不要用力甩。"

[[levels]]
short = "抛剑尖"
name = "抛上剑尖"
goal = "把玉抛起后，用剑尖接进玉孔。"
steps = [
  "一手握剑，一手让玉的孔朝向剑尖。",
  "轻托玉向上，让它在眼前短暂停住。",
  "用剑尖对准孔迎上去，接住后稳住 2 秒。",
]
pass_condition = "剑尖穿过玉孔，玉稳住 2 秒。"
tip = "先练低抛和瞄准；失败时立刻把剑收开，先保护自己。"
