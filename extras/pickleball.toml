id = "pickleball"
name = "匹克球"
summary = "从控制球拍开始，练到连续对打和指定落点。"
safety = "先确认周围有人时不要挥拍；与同伴保持距离，不追抢同一颗球，球滚进场地时先停拍。"

[[levels]]
short = "托球站稳"
name = "托球站稳"
goal = "先让球安静地停在球拍上，感受拍面是否水平。"
steps = [
  "双脚分开站稳，把匹克球放在球拍中央。",
  "轻轻调整手腕，让球不再滚动。",
  "保持 5 秒，再用手把球拿下来。",
]
pass_condition = "球在拍面上稳住 5 秒。"
tip = "眼睛看球，手腕放松；拍面越平，球越容易停住。"

[[levels]]
short = "连续颠球"
name = "连续颠球"
goal = "用小幅、均匀的动作让球连续弹起。"
steps = [
  "一手拿球拍，把球轻轻抛到拍面上方。",
  "用球拍向上托球，让球每次只弹起一小段。",
  "从 1 次开始，慢慢增加到 5 次。",
]
pass_condition = "连续颠球 5 次，球没有落地。"
tip = "不要大力挥拍；用手腕的小动作把球保持在身体前方。"

[[levels]]
short = "对墙连打"
name = "对墙连续打"
goal = "让球从墙面回到拍面，练习接住来球。"
steps = [
  "站在距离墙面约 2 米的位置。",
  "球拍轻推球撞墙，等球落下再向前送出。",
  "尽量让球连续回来 5 次。",
]
pass_condition = "对墙连续完成 5 次来回。"
tip = "站位不要太贴近墙；每次击球后回到准备姿势。"

[[levels]]
short = "两人对打"
name = "两人连续对打"
goal = "和同伴把球稳稳来回打到一起。"
steps = [
  "两人分开站好，先约定只打轻柔的直线球。",
  "一人发球，另一人接住来球再打回。",
  "成功后继续，目标是连续来回 8 次。",
]
pass_condition = "和同伴连续完成 8 次来回。"
tip = "先把球送向同伴身边，不追求速度和角度。"

[[levels]]
short = "落点控制"
name = "落点控制"
goal = "控制球落到地面上的目标区域。"
steps = [
  "在地面画两个相距不远的目标区。",
  "从近距离轻击球，让它落在目标区内。",
  "左右两个目标各试 3 次。",
]
pass_condition = "两个目标区各至少有 1 次落点成功。"
tip = "先看目标再出拍；击球轻一点，更容易控制落点。"
