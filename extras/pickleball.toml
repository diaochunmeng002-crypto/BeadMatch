id = "pickleball"
name = "匹克球"
summary = "从托球、拖球走和接抛控球开始，练到变化颠球、双拍控球，再到对墙和两人的连续对打。"
card_summary = "从托球走动、接抛练到双拍、对墙和两人连续对打。"
safety = "使用儿童或轻量球拍，拖球、绕障和边走边颠要在平整、干燥、防滑且没有障碍的路线进行；先确认周围有人时不要挥拍，接抛不朝脸或身体砸球，双拍练习要给两只手留出空间，不追抢同一颗球。"

[[levels]]
short = "托球站稳"
group = "球感入门"
name = "托球站稳"
goal = "先让球安静地停在球拍上，感受拍面是否水平。"
steps = [
  "双脚分开站稳，把匹克球放在球拍中央。",
  "轻轻调整手腕，让球不再滚动。",
  "保持 5 秒，再用手把球拿下来。",
]
tip = "眼睛看球，手腕放松；拍面越平，球越容易停住。"

[[levels]]
short = "拖球走"
group = "球感入门"
name = "用球拍拖着球走"
goal = "让球贴着地面滚动，练习一边走一边用很轻的拍面控制方向。"
steps = [
  "站在平整、干燥的地面上，把球放在身体前方，球拍轻轻贴向球的后侧。",
  "用拍面轻推球向前滚动，只给一点点力量，不要向下压球。",
  "迈小步跟着球走 3～5 步，球跑偏时就停下来，把球放回拍面前方。",
]
tip = "拖球走的重点是轻轻跟住球；眼睛别只盯着脚，给球留出向前滚动的空间。"

[[levels]]
short = "绕障拖球"
group = "球感入门"
name = "控制球绕过障碍物"
goal = "在拖着球走的基础上改变方向，并让球始终贴地滚动。"
steps = [
  "在平整地面上间隔摆 3 个瓶盖或小标志物，先清空路线上的其他东西。",
  "球拍轻贴球的后侧，让球从标志物旁边绕过去，不碰倒障碍。",
  "先慢速走一条弯线，再停在最后一个标志物旁，把球轻轻收住。",
]
tip = "转弯时减小推力，用拍面方向带着球走；球跑远了就停下重新开始。"

[[levels]]
short = "落地抓球"
group = "球感入门"
name = "等球落地，再用手接住"
goal = "练习盯住落点，等球弹起一次后把手放到正确位置。"
steps = [
  "站在空旷处，一只手把球举到胸前，放在身体正前方。",
  "松手让球自然落地，眼睛看着落点，不追着球跑。",
  "等球弹起一次，两手在腰前合拢接住，别等第二次落地。",
]
tip = "把球落在身体前方一臂远的位置；双手先张开等球，不要贴着脸接。"

[[levels]]
short = "口令接抛"
group = "接球与缓冲"
name = "听方向口令接球"
goal = "听到方向口令后先移动脚步，再找到来球并用双手接住。"
steps = [
  "同伴在 2～3 米外轻轻抛球，抛前先喊“左、右、前、高、低”里的一个口令。",
  "听到口令后先用小步移动到球的下方，不追着球挥手，也不向后退着抢球。",
  "等球弹起一次后，用双手在胸前接住；每次接完回到中间准备位置。",
]
tip = "先移动脚步再接球，头保持抬起看球；抛球只送到身体附近，不朝脸扔。"

[[levels]]
short = "拍面接稳"
group = "接球与缓冲"
name = "用拍面接球并停稳"
goal = "用球拍迎住来球、稍微卸力，再把球稳稳带下来。"
steps = [
  "自己或同伴把球轻轻抛到胸前高度，持拍手把拍面伸到球的下方。",
  "球碰到拍面时，手向后稍微收一点，让球在拍面上停住，不要继续向上颠。",
  "球停稳后，慢慢倾斜拍面，让球滚到不持拍的手里。",
]
tip = "接球时拍面像软垫一样迎上去再收回；球弹得太高说明手太硬或迎球太快。"

[[levels]]
short = "拍打再抓"
group = "接球与缓冲"
name = "落地拍起，再用手接住"
goal = "球落地弹起后，用球拍向上轻拍一次，再用不持拍的手接住。"
steps = [
  "一手拿球，在身体前方略偏持拍手的一侧松手，让球自然落地。",
  "等球第一次弹起、升到腰部高度时，用球拍正面从下往上轻拍。",
  "球再落下时，用不持拍的手在第二次落地前接住。",
]
tip = "拍的是弹起来的球，不是地上的球；拍面从球下方迎上去，动作要小。"

[[levels]]
short = "一弹一停"
group = "接球与缓冲"
name = "球落地一次后接稳"
goal = "用球拍把球送到地面，等它弹起后用拍面接住并稳住。"
steps = [
  "把球放在拍面前方，用球拍轻轻向下送球，让它落在身体前方。",
  "等球从地面弹起、升到腰部高度后，把球拍伸到球下方接住。",
  "球在拍面上停稳后再开始下一次，先练一次完整的一送、一弹、一接。",
]
tip = "向下送球只用很小的力量；接球时把球拍稍微后收，给球留出缓冲空间。"

[[levels]]
short = "连续颠球"
group = "颠球变化"
name = "用球拍连续颠球"
goal = "用小幅、均匀的动作让球连续弹起。"
steps = [
  "一手拿球拍，把球轻轻抛到拍面上方。",
  "用球拍向上托球，让球每次只弹起一小段。",
  "从 1 次开始，慢慢增加到 5 次。",
]
tip = "不要大力挥拍；用手腕的小动作把球保持在身体前方。"

[[levels]]
short = "高低变化"
group = "颠球变化"
name = "一次低颠，一次高颠"
goal = "用同一个拍面改变颠球高度，练习控制送球力量。"
steps = [
  "先用小幅动作把球颠到腰部高度，再用稍大一点的动作把下一球颠到头顶附近。",
  "高球落下时不要追着球跑，等它回到身体前方再用拍面接住。",
  "在低、高之间交替，每完成一组就重新站稳，不让球飞到身后。",
]
tip = "低球收住力量，高球只多送一点；先追求高度准确，再逐渐增加连续次数。"

[[levels]]
short = "正反交替"
group = "颠球变化"
name = "用球拍正反面轮流颠球"
goal = "每颠一次转动拍面，让球在正反面之间来回落下。"
steps = [
  "先只用正面颠 2 次，再让球落到反面继续颠。",
  "每次击球后把手腕轻轻翻转，让下一次迎接球的拍面朝上。",
  "先从正面、反面各一次开始，熟悉后连续交替，不让球飞出身体前方。",
]
tip = "翻转拍面要早一点完成，等球落低再击；动作小而连贯，不追着球乱翻手腕。"

[[levels]]
short = "走动颠球"
group = "颠球变化"
name = "边走边颠，听口令停住"
goal = "在移动中保持球不落地，并在听到口令后迅速停下稳住。"
steps = [
  "在平整空地上慢慢向前走，同时用球拍小幅颠球，把球保持在胸前。",
  "同伴喊“停”时立刻收住脚步，继续轻轻颠球并尽量留在原地。",
  "听到“退”时小步后退，听到“走”再继续向前；先走直线，再练转向。",
]
tip = "脚步小而稳，眼睛在球和前方之间切换；球偏离身体前方时先停下重新开始。"

[[levels]]
short = "落地挑球"
group = "进阶控球与对墙"
name = "落地后向前上方挑球"
goal = "球从地面弹起后，用球拍把球挑向前上方，再把它接住。"
steps = [
  "一手拿球，在身体前方约一臂远的位置松手，让球自然落地。",
  "等球第一次弹起时，把拍面放在球下方，向前上方轻轻挑。",
  "球到胸前高度后，用不持拍的手接住，重新开始下一次。",
]
tip = "挑球不是贴地铲球；拍面从球下方迎上去，往前方送一点，不向身后挑。"

[[levels]]
short = "双拍交替"
group = "进阶控球与对墙"
name = "两只球拍轮流颠球"
goal = "左右手各拿一只轻球拍，让球从一个拍面弹起后落到另一个拍面。"
steps = [
  "左右手各拿一只轻球拍，先用一只拍把球轻轻向上颠起。",
  "另一只拍放在球会落下的位置，等球落低后再轻轻向上托。",
  "从左右各拍一次开始，慢慢做到连续交替 6 次。",
]
tip = "两只球拍都只做小幅动作，给彼此留出空间；球保持在胸前，不要越拍越高。"

[[levels]]
short = "对墙落地"
group = "进阶控球与对墙"
name = "对墙击打落地球"
goal = "球从墙面弹回并落地后，再把球打回墙面，形成有节奏的落地击打。"
steps = [
  "站在距离平整墙面约 2 米的位置，先确认墙面和周围安全。",
  "用球拍把球轻推向墙面，等球从墙弹回、在地面落地一次。",
  "球再次弹起后，用球拍把它送回墙面，从连续 1 次开始练到 5 次。",
]
tip = "等球从地面弹起再击打，不要抢在落地前挥拍；站位不要太贴近墙。"

[[levels]]
short = "对墙不落地"
group = "进阶控球与对墙"
name = "对墙连续不落地击打"
goal = "让球从墙面直接回到拍面，保持球不落地地连续击墙。"
steps = [
  "站在距离墙面约 1～1.5 米的位置，身体侧对墙面站稳。",
  "用球拍轻推球撞墙，球返回时在落地前用拍面再碰一次。",
  "先完成 1 次不落地回击，再慢慢增加到连续 3 次。",
]
tip = "回拍动作要短，只轻轻把球送回墙面；球太低时先停下，重新从一次开始。"

[[levels]]
short = "两人落地对打"
group = "对打与应用"
name = "让球落地一次后再对打"
goal = "和同伴合作，让球在每一侧落地一次后再回击，建立稳定的来回节奏。"
steps = [
  "两人分开站好，先约定只打轻柔的直线球。",
  "一人把球轻发到同伴一侧，等球落地弹起后再回击。",
  "每一侧都等一次落地再送回去，目标是连续来回 8 次。",
]
tip = "先把球送向同伴身边，不追求速度和角度；球落地后重新找到节奏再出拍。"

[[levels]]
short = "不落地对打"
group = "对打与应用"
name = "两人不落地连续对打"
goal = "和同伴把球在空中直接送回去，完成更快的连续对打。"
steps = [
  "两人相距约 1.5～2 米站好，先约定不打扣球、不朝人挥拍。",
  "一人轻轻把球托向同伴，另一人在球落地前把球托回去。",
  "每次都用小幅度上托，目标是连续来回 5 次。",
]
tip = "把球托到同伴胸前高度，给双方留出反应时间；动作越小，越容易保持连续。"

[[levels]]
short = "落点控制"
group = "对打与应用"
name = "落点控制"
goal = "控制球落到地面上的目标区域。"
steps = [
  "在地面画两个相距不远的目标区。",
  "从近距离轻击球，让它落在目标区内。",
  "左右两个目标各试 3 次。",
]
tip = "先看目标再出拍；击球轻一点，更容易控制落点。"
