id = "tabletennis"
name = "乒乓球"
summary = "先练拍面停球、颠球和对墙反弹，再上球台练第一落点、过网与落点控制。"
card_summary = "先练控拍控球，再上球台练过网和落点。"
safety = "使用儿童尺寸球拍；对墙练习时确认墙面、地面和周围没有玻璃或易碎物。上球台前检查四角、桌腿和地面，只让球落在台面，不钻到桌下追球，不朝人挥拍。"

[[levels]]
short = "拍面停球"
name = "让球安静地停在球拍上"
goal = "先感受拍面是否端平，不急着让球弹起来。"
steps = [
  "双脚分开站稳，把乒乓球轻轻放在球拍中央。",
  "微微调整手腕，让拍面保持水平，球不要滚下去。",
  "保持 3 秒后，用另一只手把球拿下来。",
]
pass_condition = "连续尝试 3 次，至少 2 次让球稳稳停住 3 秒。"
tip = "看球拍中央，手腕放平；球一滚就先停下，重新放稳。"

[[levels]]
short = "原地轻颠"
name = "让小球连续弹起"
goal = "用很小幅度的动作连续颠球，控制乒乓球只弹起一小段。"
steps = [
  "一手拿球拍，一手把球轻轻放到拍面上方。",
  "用手腕的小动作向上托球，不要大力挥拍。",
  "从 1 次开始，慢慢增加到连续 5 次。",
]
pass_condition = "连续颠球 5 次，球没有落地或飞出太远。"
tip = "乒乓球很轻，动作越小越好；让球保持在身体前方。"

[[levels]]
short = "对墙接反弹"
name = "打墙后接住回来那一下"
goal = "把球轻推到墙上，等它反弹并落地一次后接住，感受来球的方向。"
steps = [
  "面向平整墙面站好，距离墙面约 1 米，先确认周围安全。",
  "用球拍轻轻把球送向墙面，不要用力扣打。",
  "让球从墙面弹回、落到地面一次，再用不持拍的手接住。",
]
pass_condition = "5 次中至少 3 次击中墙面，并在一次落地后接住球。"
tip = "先练接住，再练连续；每次只轻推一下，不追着球跑。"

[[levels]]
short = "第一落点在己方"
name = "让球先落在自己半台"
goal = "先感受球在台面上的第一落点，不急着把球打过网。"
steps = [
  "站在球台一端，把不持拍的手扶在台边保持平衡。",
  "用球拍轻轻向上托一次，让球落在自己半台，再接稳或挡稳。",
  "每次重新拿好球，连续尝试 3 次。",
]
pass_condition = "3 次中至少 2 次第一落点在自己半台，球没有滚下桌。"
tip = "眼睛看台面，不要一直盯着球拍；手腕放松，只给一点点力量。"

[[levels]]
short = "轻推过网"
name = "轻轻送过球网"
goal = "在球从己方台面弹起后轻推，让球越过球网落到对面半台。"
steps = [
  "站在球台一端，自己把球轻轻抛到己方半台。",
  "等球弹起后，用球拍从下往上轻推，不要大力扣球。",
  "球落到对面半台后重新拿球，再试下一次。",
]
pass_condition = "5 次中至少 2 次越过球网并落到对面半台。"
tip = "先保证过网和落台，再考虑落点；加力反而容易把球打飞。"

[[levels]]
short = "左右落点"
name = "把球送到左边或右边"
goal = "提前听到目标方向，再把球送到对面半台的左侧或右侧。"
steps = [
  "把对面半台在心里分成左右两个区，中线当作分界。",
  "家长先喊“左”或“右”，孩子用同样的动作把球送过去。",
  "左右各试 3 次，每送完一球都重新站稳。",
]
pass_condition = "左右两个方向各有至少 1 次落在叫到的半区。"
tip = "先用很小的力量把球送过网，再通过站位和拍面方向改变左右落点。"

[[levels]]
short = "长短落点"
name = "一次近网，一次靠后"
goal = "区分靠近球网的短球和靠近对面底线的长球，体会同一个轻推动作下的力量变化。"
steps = [
  "把对面半台看成“近网”和“靠后”两个目标。",
  "先喊“短球”，让球过网后尽量落在靠近球网的位置。",
  "再喊“长球”，保持过网高度，让球落到更靠后的区域。",
]
pass_condition = "短球和长球各至少成功 1 次，而且两次都落在对面台面。"
tip = "短球收住力量，长球也只多送一点点；不要为了打远而抬高手腕。"

[[levels]]
short = "合作连续回球"
name = "两个人在球台上来回"
goal = "和同伴用慢速、轻力量维持连续回球，让每一球都遵守台面反弹。"
steps = [
  "两人各站球台一端，先约定只轻轻把球送回对方身边。",
  "一人发球，另一人等球在己方台面弹起后再回球。",
  "球掉落后重新开始，每次记录最长连续来回次数。",
]
pass_condition = "一轮中完成至少 5 次连续来回，球没有飞离球台。"
tip = "把目标放在“让同伴容易接”，不要争速度和角度；先站稳再出拍。"
