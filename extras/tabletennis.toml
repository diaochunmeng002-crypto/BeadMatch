id = "tabletennis"
name = "乒乓球"
summary = "不用球台也能先练拍面、颠球、接抛和对墙，再上台练第一落点、发球、落点与正反手。"
card_summary = "无台也能练球感与对墙，有台再练发球、落点和正反手。"
safety = "使用儿童或轻量球拍；无台练习先清空周围，对墙时避开玻璃和易碎物。上台前检查桌腿、桌角和地面，不钻到桌下追球，不朝人挥拍；桌面滚球要在球台空着且台面干燥时进行。"

[[levels]]
short = "拍面停球"
group = "球感入门"
venue = "无台"
name = "让小球安静地停在球拍上"
goal = "先感受拍面是否端平，不急着让球弹起来。"
steps = [
  "双脚分开站稳，把乒乓球轻轻放在球拍中央。",
  "微微调整手腕，让拍面保持水平，球不要滚下去。",
  "保持 3 秒后，用另一只手把球拿下来。",
]
tip = "看球拍中央，手腕放平；球一滚就先停下，重新放稳。"

[[levels]]
short = "原地轻颠"
group = "球感入门"
venue = "无台"
name = "让小球连续轻弹"
goal = "用很小幅度的动作连续颠球，控制乒乓球只弹起一小段。"
steps = [
  "一手拿球拍，一手把球轻轻放到拍面上方。",
  "用手腕的小动作向上托球，不要大力挥拍。",
  "从 1 次开始，慢慢增加到连续 5 次。",
]
tip = "乒乓球很轻，动作越小越好；让球保持在身体前方。"

[[levels]]
short = "高低颠球"
group = "球感入门"
venue = "无台"
name = "一次低颠，一次高颠"
goal = "用同一个拍面改变颠球高度，练习控制送球力量。"
steps = [
  "先用小幅动作把球颠到腰部高度，再用稍大一点的动作把下一球颠到头顶附近。",
  "高球落下时不要追着球跑，等它回到身体前方再用拍面接住。",
  "低、高交替练习；球飞出身体前方时先停下来重新开始。",
]
tip = "低球收住力量，高球只多送一点；不要用手臂大幅抡拍。"

[[levels]]
short = "正反交替"
group = "球感入门"
venue = "无台"
name = "用球拍正反面轮流颠球"
goal = "每颠一次转动拍面，让球在球拍两面之间来回落下。"
steps = [
  "先只用正面颠 2 次，再让球落到反面继续颠。",
  "每次击球后轻轻转动手腕，让下一次迎接球的拍面朝上。",
  "从正面、反面各一次开始，熟悉后再连续交替。",
]
tip = "翻转拍面要早一点完成，等球落低再击；动作小而连贯。"

[[levels]]
short = "台面滚球"
group = "球感入门"
venue = "有台"
name = "用拍面带着球沿台面滚"
goal = "让球贴着己方台面滚动，练习轻触、方向和台边位置感。"
steps = [
  "把球放在己方半台中央，球拍轻贴球的后侧。",
  "用很小的向前的力量带球滚动，不向下压，也不把球推到球网下面。",
  "先沿直线滚到两个标记旁，再练习停在台边之前。",
]
tip = "眼睛同时看球和台边；球滚快时减小力量，跑偏时停下重新放球。"

[[levels]]
short = "口令接抛"
group = "接球与缓冲"
venue = "无台"
name = "听方向口令接球"
goal = "听到方向口令后先移动脚步，再找到小球并用手接住。"
steps = [
  "同伴在 2 米外轻轻抛球，抛前喊“左、右、前、高、低”里的一个口令。",
  "听到口令后用小步移动到球的下方，不追着球挥手。",
  "等球弹起一次后用双手接住，再回到中间准备位置。",
]
tip = "先移动脚步再接球；抛球只送到身体附近，不朝脸扔。"

[[levels]]
short = "拍面接稳"
group = "接球与缓冲"
venue = "无台"
name = "用拍面接球并停稳"
goal = "用球拍迎住来球、稍微卸力，让乒乓球在拍面上停住。"
steps = [
  "自己或同伴把球轻轻抛到胸前高度，持拍手把拍面伸到球下方。",
  "球碰到拍面时，手向后稍微收一点，让球停住，不要继续向上托。",
  "球稳定后倾斜拍面，让它滚到不持拍的手里。",
]
tip = "拍面像软垫一样迎上去再收回；球弹得太高说明手太硬。"

[[levels]]
short = "一弹一停"
group = "接球与缓冲"
venue = "无台"
name = "球落地一次后接稳"
goal = "用球拍把球送到地面，等它弹起后用拍面接住。"
steps = [
  "把球放在拍面前方，用球拍轻轻向下送球，让球落在身体前方。",
  "等球从地面弹起后，把球拍伸到球下方接住。",
  "球在拍面上停稳后再做下一次，先练一次完整的一送、一弹、一接。",
]
tip = "向下送球只用很小的力量；接球时球拍稍微后收。"

[[levels]]
short = "对墙接反弹"
group = "接球与缓冲"
venue = "无台"
name = "打墙后接住回来那一下"
goal = "把球轻推到墙上，等它反弹并落地一次后接住。"
steps = [
  "面向平整墙面站好，距离墙面约 1 米，先确认周围安全。",
  "用球拍轻轻把球送向墙面，不要用力扣打。",
  "让球从墙面弹回、落到地面一次，再用不持拍的手接住。",
]
tip = "先练接住，再练连续；乒乓球弹得快，动作尽量小。"

[[levels]]
short = "对墙不落地"
group = "过网基础"
venue = "无台"
name = "球不落地连续轻打墙面"
goal = "球从墙面直接回到拍面，练习快速找球和短距离回拍。"
steps = [
  "站得离墙稍近一些，用球拍轻推球撞墙。",
  "球从墙面返回时，在落地前用拍面再轻轻送回去。",
  "先完成一次不落地回击，再逐渐增加连续次数。",
]
tip = "回拍动作要短，球太低或太快时先停下；不要为了连续而追着球挥拍。"

[[levels]]
short = "台面弹起接稳"
group = "过网基础"
venue = "有台"
name = "球在己方台面弹起后接稳"
goal = "感受乒乓球在台面上的反弹，先用拍面把来球稳稳接住。"
steps = [
  "把球轻轻抛到自己半台，让它先落在台面弹起。",
  "球弹起时把拍面伸到球下方，稍微后收把它接稳。",
  "球停稳后用手拿下来，重新抛球再试。",
]
tip = "先看第一落点，再接弹起的球；不要站在球桌前贴着台面伸手。"

[[levels]]
short = "第一落点在己方"
group = "过网基础"
venue = "有台"
name = "让球先落在自己半台"
goal = "先感受球在台面上的第一落点，不急着把球打过网。"
steps = [
  "站在球台一端，把不持拍的手扶在台边保持平衡。",
  "用球拍轻轻向上托一次，让球落在自己半台，再接稳或挡稳。",
  "每次重新拿好球，连续尝试 3 次。",
]
tip = "眼睛看台面，不要一直盯着球拍；手腕放松，只给一点点力量。"

[[levels]]
short = "轻推过网"
group = "过网基础"
venue = "有台"
name = "轻轻把球送过网"
goal = "在球从己方台面弹起后轻推，让球越过球网落到对面半台。"
steps = [
  "站在球台一端，自己把球轻轻抛到己方半台。",
  "等球弹起后，用球拍从下往上轻推，不要大力扣球。",
  "球落到对面半台后重新拿球，再试下一次。",
]
tip = "先保证过网和落台，再考虑落点；加力反而容易把球打飞。"

[[levels]]
short = "正确发球"
group = "过网基础"
venue = "有台"
name = "让发球先落在自己台面"
goal = "用简单的平击发球，让球先落在己方半台，再越过球网。"
steps = [
  "站在球台端线后，把球放在张开的非持拍手上，球拍放在球的后下方。",
  "把球轻轻向上抛起，等球落下时向前轻推。",
  "让球先弹在己方半台，再越过球网并落到对面。",
]
tip = "先把抛球和轻推配合好，不追求旋转和速度；发球前确认对面没有人靠得太近。"

[[levels]]
short = "左右落点"
group = "落点与正反手"
venue = "有台"
name = "把球送到左边或右边"
goal = "提前听到目标方向，再把球送到对面半台的左侧或右侧。"
steps = [
  "把对面半台在心里分成左右两个区，中线当作分界。",
  "家长先喊“左”或“右”，孩子用同样的动作把球送过去。",
  "左右各试 3 次，每送完一球都重新站稳。",
]
tip = "先用很小的力量把球送过网，再通过站位和拍面方向改变左右落点。"

[[levels]]
short = "长短落点"
group = "落点与正反手"
venue = "有台"
name = "一次近网，一次靠后"
goal = "区分靠近球网的短球和靠近对面底线的长球，体会同一个轻推动作下的力量变化。"
steps = [
  "把对面半台看成“近网”和“靠后”两个目标。",
  "先喊“短球”，让球过网后尽量落在靠近球网的位置。",
  "再喊“长球”，保持过网高度，让球落到更靠后的区域。",
]
tip = "短球收住力量，长球也只多送一点点；不要为了打远而抬高手腕。"

[[levels]]
short = "正手轻推"
group = "落点与正反手"
venue = "有台"
name = "在身体右侧轻推来球"
goal = "用正手一侧站稳，等球弹起后向前轻推，不甩大臂。"
steps = [
  "站在球台一端，身体稍微侧向，持拍手放在身体右侧前方。",
  "让同伴或自己把球送到正手一侧，等球在台面弹起。",
  "球到腰部附近时，向前轻推并回到准备姿势。",
]
tip = "右手持拍练右侧，左手持拍就镜像到左侧；先站稳再轻推，不追着球甩手臂。"

[[levels]]
short = "反手轻推"
group = "落点与正反手"
venue = "有台"
name = "在身体前方轻推来球"
goal = "把球拍放在身体前方，等球弹起后用反手轻推回去。"
steps = [
  "站在球台一端，双手或持拍手把球拍放到身体中线前方。",
  "等球从台面弹起、来到身体前方时，向前小幅度推球。",
  "每次推完球把手回到身体前方，准备下一球。",
]
tip = "反手动作幅度更小，肘部保持放松；先保证碰到球，再练落点。"

[[levels]]
short = "正反手交替"
group = "对打应用"
venue = "有台"
name = "左右来球轮流用正反手"
goal = "根据来球落在身体左侧还是右侧，选择正手或反手接球。"
steps = [
  "让对方把球交替送到身体两侧，先只要求把球稳稳回过去。",
  "球到正手一侧用正手轻推，到身体前方用反手轻推。",
  "先慢速交替，再逐渐减少两球之间的停顿。",
]
tip = "先判断球落在哪边，再移动和出拍；不要用正手硬够反手位的球。"

[[levels]]
short = "空中对托"
group = "对打应用"
venue = "无台"
name = "两人不落地轻托小球"
goal = "没有球台时也能和同伴练习轻碰、找球和连续回拍。"
steps = [
  "两人相距约 1.5 米，先用软球或乒乓球做非常轻的上托。",
  "一人把球托到同伴身体前方，另一人在球落地前用拍面托回去。",
  "先约定不打扣球、不朝人挥拍，目标是慢慢完成连续来回。",
]
tip = "把球托到同伴胸前高度，动作小、力量轻；球太低时先接住重新开始。"

[[levels]]
short = "合作连续回球"
group = "对打应用"
venue = "有台"
name = "两个人在球台上来回"
goal = "和同伴用慢速、轻力量维持连续回球，让每一球都遵守台面反弹。"
steps = [
  "两人各站球台一端，先约定只轻轻把球送回对方身边。",
  "一人发球，另一人等球在己方台面弹起后再回球。",
  "球掉落后重新开始，每次记录最长连续来回次数。",
]
tip = "把目标放在“让同伴容易接”，不要争速度和角度；先站稳再出拍。"

[[levels]]
short = "叫落点来回"
group = "对打应用"
venue = "有台"
name = "听口令把球送到指定区域"
goal = "在连续来回中加入方向口令，把台面控制用到真实对打里。"
steps = [
  "两人先慢速对打，只用一个容易接的轻推动作。",
  "同伴在球过网前喊“左、右、短、长”里的一个口令。",
  "回球的人听到后调整站位和拍面，把球送到叫到的区域；下一球再换目标。",
]
tip = "口令先少后多，先保证来回不断；开始时只喊左右，再加入长短。"
