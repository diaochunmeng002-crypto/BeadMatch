id = "pitchpot"
name = "投壶"
summary = "从手递入壶到退后连续投中，逐级调整距离和节奏。"
card_summary = "从近到远调整距离，把箭稳稳投进壶里。"
safety = "确认壶后和投掷线周围没人；使用儿童投壶的软质箭，只朝壶投掷，不在跑动中投。"

[[levels]]
short = "手递入壶"
name = "手递入壶"
goal = "先在壶边体会脱手时机，不急着拉远距离。"
steps = [
  "站在壶旁边，把一支软箭竖直拿在身前。",
  "让箭尖朝向壶口，轻轻松手让箭自然落进去。",
  "连续投入 3 支，再重新捡起。",
]
pass_condition = "在壶边连续投入 3 支，至少 2 支进壶。"
tip = "让箭自然落下，不要向下砸；先找到松手的感觉。"

[[levels]]
short = "近距投准"
name = "近距离投准"
goal = "从一步距离开始，练习让箭向上落入壶口。"
steps = [
  "站到距离壶约 1 步的投掷线后。",
  "一手拿箭，轻向上送，让箭的弧线落向壶口。",
  "每次投 5 支，投完再统一捡箭。",
]
pass_condition = "5 支中至少 1 支进壶。"
tip = "瞄准壶口上方一点，给箭留出下落空间。"

[[levels]]
short = "退后一步"
name = "退后一步"
goal = "增加距离，保持相同的投掷动作。"
steps = [
  "站到距离壶约 2 步的投掷线后。",
  "先空摆两次，再投 5 支软箭。",
  "每投一支都在同一位置重新站稳。",
]
pass_condition = "5 支中至少 2 支进壶。"
tip = "距离变远时只加大一点点力量，先保证方向。"

[[levels]]
short = "换手投"
name = "换手投"
goal = "用另一只手完成同样的投掷动作。"
steps = [
  "站在前一级的投掷线后，用另一只手拿箭。",
  "先用另一只手试投 3 支，再用习惯手持箭投 3 支。",
  "比较两只手的弧线和落点。",
]
pass_condition = "另一只手和习惯手各至少投进 1 支。"
tip = "换手后动作会变生疏，宁可用小一点的力量。"

[[levels]]
short = "连续命中"
name = "连续命中"
goal = "在稍远距离维持稳定的出手节奏。"
steps = [
  "站到距离壶约 3 步的投掷线后。",
  "准备 5 支软箭，按相同节奏连续投出。",
  "每投一支都确认壶周围仍然安全。",
]
pass_condition = "5 支中至少 2 支持续命中，且出现连续 2 支进壶。"
tip = "投偏后不要马上加快速度；停一下，重新找壶口上方的落点。"
