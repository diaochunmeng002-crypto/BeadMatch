id = "badminton"
name = "羽毛球"
summary = "从托羽和向上挑羽开始，再用低球网练发球、前后落点与合作高球。"
card_summary = "让羽球停稳、向上挑高，再练发球和连续来回。"
safety = "使用儿童或轻量羽毛球拍；确认头顶和身体周围有足够空间，不在湿滑地面后退追球。球网或拉绳必须固定牢、容易看见，不朝人挥拍。"

[[levels]]
short = "拍面托羽"
name = "让羽球稳稳停在拍面上"
goal = "认识羽毛球不会像小球那样弹跳，先感受拍面和羽球落下的位置。"
steps = [
  "双脚分开站稳，把羽毛球轻轻放在球拍中央。",
  "调整拍面，让羽球保持稳定，不让它滚下去。",
  "保持 3 秒后，用另一只手把羽球拿下来。",
]
pass_condition = "连续尝试 3 次，至少 2 次让羽球稳稳停住 3 秒。"
tip = "羽毛球不会像小球那样弹跳；先感受它落在拍面上的方向。"

[[levels]]
short = "向上挑羽"
name = "从下往上轻轻挑"
goal = "用拍面向上挑，让羽球升到头顶附近，再自然落下接住。"
steps = [
  "一手持拍放在身前，一手把羽球轻轻松开。",
  "等羽球落到拍面前方，用拍面从下往上轻轻挑。",
  "看羽球升到头顶附近，再用不持拍的手接住。",
]
pass_condition = "尝试 5 次，至少 3 次把羽球向上挑起并安全接住。"
tip = "挑高不等于大力挥拍；先让拍面正面碰到羽球，动作保持小。"

[[levels]]
short = "连续自挑"
name = "自己把羽球连续挑起来"
goal = "在身体前方连续向上挑羽，练习眼睛追踪和每次击球的位置。"
steps = [
  "先把羽球挑到身体前方，不要让它跑到身后。",
  "每次羽球落下时，用拍面轻轻向上挑回。",
  "从连续 1 次开始，慢慢增加到 5 次。",
]
pass_condition = "连续向上挑羽 5 次，羽球没有落地。"
tip = "羽毛球越往上越慢；等它落下来再挑，不用追着它跑。"

[[levels]]
short = "高低控制"
name = "一次挑低，一次挑高"
goal = "听口令改变挑羽高度，感受同一动作下力量大小带来的差别。"
steps = [
  "家长先喊“低”，孩子把羽球轻轻挑到胸前高度并接住。",
  "再喊“高”，孩子把羽球挑到头顶附近并接住。",
  "高低各试 3 次，每次重新站稳。",
]
pass_condition = "低球和高球各至少成功 1 次，羽球都在身体前方。"
tip = "低球收住力量，高球只多送一点；不要把球挑到身后。"

[[levels]]
short = "低手发球过网"
name = "从下面把羽球送过网"
goal = "用低手发球把羽球送过固定球网，理解发球方向和过网高度。"
steps = [
  "在低球网一侧站好，先确认拉绳固定牢、周围没人。",
  "一手拿羽球放在腰前，另一手持拍从下向前推。",
  "让羽球先向上再落下，越过球网落到另一侧。",
]
pass_condition = "尝试 5 次，至少 2 次羽球越过球网并落在另一侧。"
tip = "低手发球先把球向上送，再让它向前飞；不需要大力抡拍。"

[[levels]]
short = "前后落点"
name = "把羽球送到近网或靠后"
goal = "在对面场地分出前后两个区域，练习轻放近网和挑到后场。"
steps = [
  "把球网另一侧在心里分成“近网”和“靠后”两个区域。",
  "家长先喊“近”，孩子轻轻把羽球送过网。",
  "再喊“后”，孩子用稍大一点的向上挑球送到靠后区域。",
]
pass_condition = "近网和后场各至少成功 1 次，羽球都要越过球网。"
tip = "近网靠拍面轻送，后场靠继续向上挑；先看落点，再决定用多少力。"

[[levels]]
short = "合作高球"
name = "两个人把羽球挑回来"
goal = "和同伴隔着低球网连续挑高球，让羽球有足够时间落下再回击。"
steps = [
  "两人各站球网一侧，先约定只打高高的、容易接的球。",
  "一人从下往上发球，另一人等羽球落低后再挑回去。",
  "球落地后重新开始，记录最长连续来回次数。",
]
pass_condition = "一轮中完成至少 5 次合作来回，羽球都越过球网。"
tip = "把球挑高会让双方更容易接；不要争速度和贴网，先保持节奏。"
